version: "3.8"
name: "${COMPOSE_PROJECT_NAME}"
services:
  author:
    build:
      context: .
      dockerfile: author/Dockerfile
    ports:
      - "${AEM_AUTHOR_PORT}:4502"
      - "30303:30303"
    volumes:
      - author_data:/opt/aem/crx-quickstart

  publish:
    build:
      context: .
      dockerfile: publish/Dockerfile
    ports:
      - "${AEM_PUBLISH_PORT}:4503"
      - "30304:30304"
    volumes:
      - publish_data:/opt/aem/crx-quickstart

  dispatcher:
    image: adobe/aem-cs/dispatcher-publish:2.0.235
    ports:
      - "${DISPATCHER_PORT}:80"
    depends_on:
      - publish
    environment:
      - AEM_HOST=publish
      - AEM_PORT=4503
      - ENVIRONMENT_TYPE=dev
      - DISP_LOG_LEVEL=debug
      - REWRITE_LOG_LEVEL=warn
      - ALLOW_CACHE_INVALIDATION_GLOBALLY=true
    volumes:
      - dispatcher_cache:/mnt/var/www
      - ${DISPATCHER_PATH:-./dispatcher/dispatcher-sdk-2.0.235/src}:/mnt/dev/src:ro
      - ./dispatcher/dispatcher-sdk-2.0.235/lib/import_sdk_config.sh:/docker_entrypoint.d/zzz-import-sdk-config.sh:ro
      - ./dispatcher/dispatcher-sdk-2.0.235/lib/dummy_gitinit_metadata.sh:/docker_entrypoint.d/zzz-overwrite_gitinit_metadata.sh:ro
      - ./dispatcher/dispatcher-sdk-2.0.235/lib/overwrite_cache_invalidation.sh:/docker_entrypoint.d/zzz-overwrite_cache_invalidation.sh:ro
      - ./dispatcher/dispatcher-sdk-2.0.235/lib:/usr/lib/dispatcher-sdk:ro
volumes:
  author_data:
  publish_data:
  dispatcher_cache:
