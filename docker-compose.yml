name: "${COMPOSE_PROJECT_NAME}"
services:
  author:
    build:
      context: .
      dockerfile: author/Dockerfile
    ports:
      - "${AEM_AUTHOR_PORT}:4502"
      - "30303:30303"
    volumes:
      - author_data:/opt/aem/crx-quickstart

  publish:
    build:
      context: .
      dockerfile: publish/Dockerfile
    ports:
      - "${AEM_PUBLISH_PORT}:4503"
      - "30304:30304"
    volumes:
      - publish_data:/opt/aem/crx-quickstart

  dispatcher:
    # Official AEMaaCS dispatcher image shipped with the Dispatcher SDK.
    # Load it first with: ./scripts/dispatcher.sh load
    image: "adobe/aem-ethos/dispatcher-publish:${DISPATCHER_SDK_VERSION}"
    ports:
      - "${DISPATCHER_PORT}:80"
    depends_on:
      - publish
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      AEM_HOST: "${DISPATCHER_AEM_HOST:-publish}"
      AEM_PORT: "${DISPATCHER_AEM_PORT:-4503}"
      ENVIRONMENT_TYPE: dev
      DISP_LOG_LEVEL: "${DISP_LOG_LEVEL:-Warn}"
      REWRITE_LOG_LEVEL: "${REWRITE_LOG_LEVEL:-Warn}"
      COMMERCE_ENDPOINT: "${COMMERCE_ENDPOINT:-http://localhost/graphql}"
      ALLOW_CACHE_INVALIDATION_GLOBALLY: "true"
    volumes:
      # Dispatcher config of any AEM project (its dispatcher/src folder)
      - "${DISPATCHER_CONFIG_DIR}:/mnt/dev/src:ro"
      - dispatcher_cache:/mnt/var/www/html

volumes:
  author_data:
  publish_data:
  dispatcher_cache:
